name: Generate Stats Images

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "15 0 * * *"  # Run daily at midnight UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json
          coverage: none

      - name: Validate environment variables
        run: |
          echo "Validating required environment variables..."
          if [ -z "${{ secrets.ACCESS_TOKEN }}" ]; then
            echo "WARNING: ACCESS_TOKEN secret is not set. Falling back to GITHUB_TOKEN."
            echo "For full stats (including private repos & traffic views) set ACCESS_TOKEN with a classic PAT (repo + read:user)."
          else
            echo "ACCESS_TOKEN is set ✓"
          fi
          echo "GITHUB_ACTOR: ${{ github.actor }}"

      - name: Generate images
        run: |
          echo "Starting image generation..."
          php --version
          php generate_images.php
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN || github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          EXCLUDED: ${{ secrets.EXCLUDED }}
          EXCLUDED_LANGS: ${{ secrets.EXCLUDED_LANGS }}
          COUNT_STATS_FROM_FORKS: ${{ secrets.COUNT_STATS_FROM_FORKS }}

      - name: Verify generated files
        run: |
          echo "Checking generated files..."
          if [ -f "generated/overview.svg" ]; then
            echo "✓ overview.svg generated ($(wc -l < generated/overview.svg) lines)"
          else
            echo "✗ overview.svg not generated"
            exit 1
          fi
          if [ -f "generated/languages.svg" ]; then
            echo "✓ languages.svg generated ($(wc -l < generated/languages.svg) lines)"
          else
            echo "✗ languages.svg not generated"
            exit 1
          fi

      - name: Commit and push generated images
        run: |
          git config --local user.name "github-stats[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add generated/
          
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            echo "Committing changes..."
            git commit -m "Update generated stats images [skip ci]" || true
            
            echo "Pushing changes..."
            git push origin ${{ github.ref_name }}
            echo "Changes pushed successfully!"
          fi
